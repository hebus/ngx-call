  name: Deploy demo to GitHub Pages

  on:
    push:
      branches: [main]
    workflow_dispatch:

  # Allow the GITHUB_TOKEN to deploy to Pages and verify the deployment via OIDC.
  permissions:
    contents: read
    pages: write
    id-token: write

  # One concurrent Pages deployment; cancel superseded in-progress runs.
  concurrency:
    group: pages
    cancel-in-progress: true

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Generate example sources
          run: npm run gen:code

        - name: Build demo (base-href scoped to the project page)
          run: npx ng build demo --configuration production --base-href=/ngx-call/

        - name: SPA fallback + disable Jekyll
          run: |
            cp dist/demo/browser/index.html dist/demo/browser/404.html
            touch dist/demo/browser/.nojekyll

        - name: Configure Pages
          uses: actions/configure-pages@v5

        - name: Upload Pages artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: dist/demo/browser

    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
